     attrs: {aw: {values: ["0,70", "0,60", "0,50"], better: higher}, fab: {values: ["Knauf Cleaneo", "Rigips Rigiton"], product: true}}}
  - {id: tb-vorsatzschale, trade: "05", unit: m2, ep: [35, 65], qty: [50, 500], risk: 0.3,
     short: "Installationsvorsatzschale herstellen",
     long: "Vorsatzschale für Sanitärinstallationen, Profil CW 50, einfach beplankt mit imprägnierten Gipsplatten GKBI 12,5 mm."}
  - {id: tb-revision, trade: "05", unit: St, ep: [80, 220], qty: [10, 120], risk: 0.5,
     short: "Revisionsöffnung in Decke einbauen",
     long: "Revisionsklappe {groesse} mm in Gipskartondecke einbauen, Leitfabrikat {fab} oder gleichwertig.",
     attrs: {groesse: {values: ["600 x 600", "400 x 400"], better: higher}, fab: {values: ["Knauf Revo", "Fermacell Revisionsklappe"], product: true}}}

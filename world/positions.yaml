# Position library for the synthetic tender world (simulator only; the engine never reads this).
# Each template becomes a BoQ position. {slots} in the long text take values from `attrs`; for every
# attribute, `better` says which direction is the stronger specification, so a planted "spec
# downgrade" can move it the wrong way. ep: plausible unit price range (EUR, net); qty: quantity
# range; risk: how likely the quantity is to grow during construction (bidders who price
# speculatively load their margin onto high-risk positions).
trades:
  "01": Baustelleneinrichtung
  "02": Erdarbeiten
  "03": Beton- und Stahlbetonarbeiten
  "04": Mauerarbeiten
  "05": Trockenbauarbeiten
  "06": Estricharbeiten
  "07": Fliesen- und Plattenarbeiten
  "08": Maler- und Lackierarbeiten
  "09": Abdichtungsarbeiten
  "10": Tischlerarbeiten

positions:
  # 01 Baustelleneinrichtung
  - {id: be-einrichten, trade: "01", unit: psch, ep: [8000, 25000], qty: [1, 1], risk: 0.1,
     short: "Baustelleneinrichtung einrichten und räumen",
     long: "Baustelleneinrichtung einschließlich aller erforderlichen Geräte, Unterkünfte und Lagerflächen einrichten, vorhalten für die gesamte Bauzeit und nach Abschluss der Arbeiten räumen."}
  - {id: be-bauzaun, trade: "01", unit: m, ep: [6, 14], qty: [80, 300], risk: 0.3,
     short: "Bauzaun aufstellen und vorhalten",
     long: "Mobilen Bauzaun, Höhe {hoehe} m, mit Fußplatten aufstellen, für die Dauer der Bauzeit vorhalten und wieder abbauen.",
     attrs: {hoehe: {values: ["2,00", "1,80"], better: higher}}}
  - {id: be-geruest, trade: "01", unit: m2, ep: [8, 16], qty: [300, 1500], risk: 0.4,
     short: "Fassadengerüst stellen, vorhalten 4 Wochen",
     long: "Arbeits- und Schutzgerüst als Fassadengerüst, Lastklasse {lk}, Breitenklasse W09, stellen, 4 Wochen Gebrauchsüberlassung vorhalten und abbauen.",
     attrs: {lk: {values: ["4", "3"], better: higher}}}
  - {id: be-baustrom, trade: "01", unit: psch, ep: [1500, 4500], qty: [1, 1], risk: 0.1,
     short: "Baustromverteiler anschließen und vorhalten",
     long: "Baustromverteiler einschließlich Anschluss an das öffentliche Netz bereitstellen, vorhalten und nach Fertigstellung zurückbauen."}
  # 02 Erdarbeiten
  - {id: erd-oberboden, trade: "02", unit: m2, ep: [3, 7], qty: [300, 2000], risk: 0.3,
     short: "Oberboden abtragen und seitlich lagern",
     long: "Oberboden in einer Stärke von {staerke} cm abtragen und auf der Baustelle seitlich in Mieten lagern.",
     attrs: {staerke: {values: ["30", "20"], better: higher}}}
  - {id: erd-baugrube, trade: "02", unit: m3, ep: [9, 22], qty: [400, 3500], risk: 0.7,
     short: "Baugrube ausheben, Boden laden und abfahren",
     long: "Baugrube ausheben, Homogenbereich {hb}, Boden laden und zur Deponie abfahren, einschließlich Deponiegebühren.",
     attrs: {hb: {values: ["B2", "B1"], better: higher}}}
  - {id: erd-verfuellen, trade: "02", unit: m3, ep: [14, 30], qty: [100, 900], risk: 0.5,
     short: "Arbeitsraum verfüllen und verdichten",
     long: "Arbeitsraum lagenweise mit Liefermaterial verfüllen und auf Dpr {dpr} % verdichten.",
     attrs: {dpr: {values: ["100", "97"], better: higher}}}
  - {id: erd-schotter, trade: "02", unit: m3, ep: [35, 60], qty: [50, 400], risk: 0.4,
     short: "Schottertragschicht 0/32 herstellen",
     long: "Schottertragschicht aus Mineralgemisch 0/32, Dicke {dicke} cm, einbauen und verdichten, Ev2 mindestens 120 MN/m².",
     attrs: {dicke: {values: ["30", "25", "20"], better: higher}}}
  - {id: erd-wasserhaltung, trade: "02", unit: h, ep: [35, 70], qty: [100, 800], risk: 0.8,
     short: "Offene Wasserhaltung betreiben",
     long: "Offene Wasserhaltung mit Tauchpumpen einschließlich Pumpensumpf betreiben, abgerechnet nach Betriebsstunden."}
  - {id: erd-entsorgung-z2, trade: "02", unit: t, ep: [25, 65], qty: [50, 600], risk: 0.8,
     short: "Belasteten Boden Z2 entsorgen",
     long: "Boden der Zuordnungsklasse Z2 nach LAGA laden, abfahren und fachgerecht entsorgen, einschließlich Nachweisen."}
  # 03 Beton- und Stahlbetonarbeiten
  - {id: stb-sauberkeit, trade: "03", unit: m2, ep: [12, 22], qty: [150, 900], risk: 0.3,
     short: "Sauberkeitsschicht aus Beton C8/10",
     long: "Sauberkeitsschicht aus unbewehrtem Beton C8/10, Dicke {dicke} cm, herstellen.",
     attrs: {dicke: {values: ["5", "3"], better: higher}}}
  - {id: stb-bodenplatte, trade: "03", unit: m3, ep: [180, 290], qty: [80, 600], risk: 0.3,
     short: "Bodenplatte aus Stahlbeton herstellen",
     long: "Bodenplatte aus Stahlbeton, Festigkeitsklasse {cls}, Expositionsklasse XC2, Dicke {dicke} cm, herstellen, einschließlich Abschalung.",
     attrs: {cls: {values: ["C30/37", "C25/30", "C20/25"], better: higher}, dicke: {values: ["30", "25", "20"], better: higher}}}
  - {id: stb-aussenwand, trade: "03", unit: m2, ep: [95, 160], qty: [200, 1400], risk: 0.2,
     short: "Stahlbetonwand außen herstellen",
     long: "Außenwand aus Stahlbeton, Festigkeitsklasse {cls}, Dicke {dicke} cm, einschließlich zweiseitiger Schalung, glatt.",
     attrs: {cls: {values: ["C30/37", "C25/30"], better: higher}, dicke: {values: ["25", "24", "20"], better: higher}}}
  - {id: stb-innenwand, trade: "03", unit: m2, ep: [80, 140], qty: [150, 1200], risk: 0.2,
     short: "Stahlbetonwand innen herstellen",
     long: "Innenwand aus Stahlbeton, Festigkeitsklasse {cls}, Dicke {dicke} cm, Sichtbetonklasse SB2.",
     attrs: {cls: {values: ["C25/30", "C20/25"], better: higher}, dicke: {values: ["20", "18"], better: higher}}}
  - {id: stb-decke, trade: "03", unit: m2, ep: [85, 150], qty: [300, 2500], risk: 0.2,
     short: "Stahlbetondecke als Ortbetondecke herstellen",
     long: "Stahlbetondecke als Ortbetondecke, Festigkeitsklasse {cls}, Dicke {dicke} cm, Feuerwiderstandsklasse {fk}, einschließlich Schalung.",
     attrs: {cls: {values: ["C30/37", "C25/30"], better: higher}, dicke: {values: ["24", "22", "20"], better: higher}, fk: {values: ["REI 90", "REI 60", "REI 30"], better: higher}}}
  - {id: stb-stuetze, trade: "03", unit: m, ep: [120, 260], qty: [40, 300], risk: 0.2,
     short: "Stahlbetonstütze rechteckig herstellen",
     long: "Stahlbetonstütze, Querschnitt {qs} cm, Festigkeitsklasse {cls}, einschließlich Schalung.",
     attrs: {qs: {values: ["30/30", "25/25"], better: higher}, cls: {values: ["C35/45", "C30/37"], better: higher}}}
  - {id: stb-bewehrung, trade: "03", unit: t, ep: [1300, 2100], qty: [20, 200], risk: 0.7,
     short: "Betonstahl B500B liefern und verlegen",
     long: "Betonstahl B500B als Stabstahl und Matten liefern, schneiden, biegen und verlegen."}
  - {id: stb-treppe, trade: "03", unit: St, ep: [2200, 5200], qty: [2, 12], risk: 0.1,
     short: "Fertigteiltreppe einbauen",
     long: "Treppenlauf als Stahlbeton-Fertigteil, gerade, liefern und einbauen, Trittschalldämmung mit Elastomerlager, Schallschutz {db} dB.",
     attrs: {db: {values: ["30", "25"], better: higher}}}
  - {id: stb-fugenband, trade: "03", unit: m, ep: [18, 40], qty: [60, 400], risk: 0.4,
     short: "Fugenband in Arbeitsfugen einbauen",
     long: "Innenliegendes Fugenband in Arbeitsfugen der wasserundurchlässigen Konstruktion liefern und einbauen, Leitfabrikat {fab} oder gleichwertig.",
     attrs: {fab: {values: ["Sika Waterbar", "Max Frank Fugenband"], product: true}}}
  # 04 Mauerarbeiten
  - {id: mw-ks-innen, trade: "04", unit: m2, ep: [45, 85], qty: [100, 900], risk: 0.2,
     short: "Kalksandstein-Innenwand mauern",
     long: "Innenwand aus Kalksandstein KS {rdk}, Dicke {dicke} cm, im Dünnbettmörtel mauern.",

letter:
- Zu Ihrer Ausschreibung vom 21.09.2026 überreichen wir Ihnen unser Angebot.
- Als ortsansässiger Fachbetrieb verfügen wir über langjährige Erfahrung im kommunalen Kanal- und Straßenbau.
- Abweichend von den Vertragsbedingungen bitten wir um eine Vorauszahlung von 15 % der Auftragssumme bei Baubeginn.
- Mit freundlichen Grüßen

letter:
- Wir danken für Ihre Anfrage und übersenden Ihnen unser Angebot im Excel-Format.
- Beim Kautschukbelag bieten wir ein gleichwertiges Produkt an, die technischen Datenblätter fügen wir bei.
- Die Untergrundvorbereitung für die Bodenbeläge haben wir in die Belagspreise eingerechnet.
- An die angebotenen Preise halten wir uns bis zum 30.11.2026 gebunden; danach bedürfen sie unserer erneuten Bestätigung.
- Ihre Ansprechpartnerin in unserem Haus ist Frau Wolff.

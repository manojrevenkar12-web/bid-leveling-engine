letter:
- Vielen Dank für die Übersendung der Ausschreibungsunterlagen zum Neubau der Kita „Am Mühlbach“.
- Beigefügt erhalten Sie unser Angebot als GAEB-Datei sowie das unterschriebene Angebotsschreiben.
- Unsere Lohn- und Materialansätze beruhen auf den Tarif- und Listenpreisen vom September 2026; erfolgt die Beauftragung nach dem 31.12.2026, passen wir die Einheitspreise entsprechend der Indexentwicklung an.
- Bei Fragen zur Kalkulation steht Ihnen unser Herr Brenner gern zur Verfügung.
- Mit freundlichen Grüßen

letter:
- Sehr geehrte Damen und Herren,
- bezugnehmend auf Ihre Ausschreibung bieten wir Ihnen die Leistungen der Titel 01 bis 06 zu den nachstehenden Einheitspreisen an.
- Da im Leistungsverzeichnis kein Fassadengerüst vorgesehen ist, haben wir dieses als zusätzliche Position aufgenommen.
- Für die Holz-Alu-Fenster bieten wir ein gleichwertiges Fabrikat an; Prospekte und Prüfzeugnisse liegen bei.
- Abschlagsrechnungen sind innerhalb von 10 Kalendertagen ohne Abzug zu bezahlen; einen Sicherheitseinbehalt akzeptieren wir nur gegen Stellung einer Bürgschaft.
- Über ein Aufklärungsgespräch würden wir uns freuen.

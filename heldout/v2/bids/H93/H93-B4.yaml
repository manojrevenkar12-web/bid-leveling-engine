letter:
- Hiermit reichen wir unser Angebot für die Hüllen- und Ausbauarbeiten an der Kita ein.
- Mit den Arbeiten können wir frühestens in KW 12/2027 beginnen, da unsere Kolonnen bis dahin anderweitig gebunden sind.
- Baustrom und Bauwasser sind uns bauseits kostenfrei zur Verfügung zu stellen.
- Mit freundlichem Gruß

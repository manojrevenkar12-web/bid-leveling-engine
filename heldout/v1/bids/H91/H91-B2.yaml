letter:
- Bezugnehmend auf Ihre Ausschreibung vom 01.09.2026 unterbreiten wir Ihnen nachstehendes Angebot.
- Die Positionsnummern stammen aus unserem Kalkulationsprogramm, die Reihenfolge entspricht Ihrem Leistungsverzeichnis.
- Wegen der anhaltend schwankenden Stahlpreise verstehen sich die Preise für Betonstahl vorbehaltlich einer Anpassung an den Erzeugerpreisindex zum Lieferzeitpunkt.
- Als Ansprechpartner steht Ihnen unser Oberbauleiter Herr Dietz zur Verfügung.
- Wir würden uns freuen, das Projekt gemeinsam mit Ihnen umzusetzen.

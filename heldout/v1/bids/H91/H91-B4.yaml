letter:
- Hiermit geben wir unser Angebot für die ausgeschriebenen Rohbau-, Abdichtungs- und Tischlerarbeiten ab.
- Das Leistungsverzeichnis wurde bei uns im Büro ausgefüllt und eingescannt.
- Aufgrund unserer derzeitigen Auslastung können wir mit den Arbeiten frühestens in der dritten Kalenderwoche 2027 beginnen.
- Bei Rückfragen erreichen Sie Herrn Fehrmann direkt im Büro in Bernau.

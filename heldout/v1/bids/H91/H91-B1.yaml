letter:
- Vielen Dank für die Übersendung der Vergabeunterlagen zur Erweiterung der Grundschule Pankow.
- Beiliegend erhalten Sie unser Angebot als GAEB-Datei für sämtliche ausgeschriebenen Titel.
- Die Baustelle haben wir am 12.09.2026 besichtigt, die Andienung über die Nebenstraße ist in unserer Kalkulation berücksichtigt.
- An die angebotenen Preise halten wir uns bis zum 31.10.2026 gebunden; bei späterer Beauftragung behalten wir uns eine Anpassung vor.
- Beim Fugenband haben wir das von uns vorgesehene Fabrikat in der Bieterangabe eingetragen.
- Für ein Aufklärungsgespräch stehen wir Ihnen jederzeit gern zur Verfügung.

letter:
- Wir danken für Ihre Anfrage und bieten die Leistungen gemäß beiliegendem Leistungsverzeichnis an.
- Die Arbeiten führen wir mit eigenem Stammpersonal aus, lediglich die Tischlerarbeiten vergeben wir an einen langjährigen Partnerbetrieb.
- Unsere Haftung für mittelbare Schäden und Folgeschäden beschränken wir, soweit gesetzlich zulässig, auf die Höhe der Auftragssumme.
- Über eine positive Rückmeldung würden wir uns sehr freuen.

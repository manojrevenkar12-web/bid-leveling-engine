[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-leveling-engine"
version = "0.1.0"
description = "Reads construction bids in any format, matches every line to the BoQ, finds where bids deviate, levels them on comparable totals, with evidence on every finding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "lxml>=5",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pillow>=10",
  "reportlab>=4.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
prefect = ["prefect>=3.4,<4"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
ble = "ble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds tenders and runs the workflow (seconds to minutes)"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108", "E741"]

[tool.mypy]
python_version = "3.11"
files = ["src/ble"]
ignore_missing_imports = true
check_untyped_defs = false

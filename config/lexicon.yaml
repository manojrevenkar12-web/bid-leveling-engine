units:                         # spellings -> canonical unit
  m2: [m2, m², qm, m^2]
  m3: [m3, m³, cbm, m^3]
  m: [m, lfm, lfdm, lm]
  St: [st, stk, stck, stück]
  psch: [psch, pauschal, pau, pschl]
  t: [t, to]
  kg: [kg]
  h: [h, std, stunden]
  Wo: [wo, woche, wochen]

  außenw: außenwand
  aussenw: außenwand
  trennw: trennwand
  dämm: dämmung
  abd: abdichtung
  fl: fliesen
  bs: brandschutz
  estr: estrich
  inkl: einschließlich
  be: baustelleneinrichtung
  ud: unterdecke
  rev: revision
  tsd: trittschalldämmung
  wdvs: wärmedämmverbundsystem
  lv: leistungsverzeichnis
  # common estimator shorthand (added after the held-out set v1 was studied; v1 is now a regression set)
  aw: außenwand
  iw: innenwand
  bp: bodenplatte
  de: decke

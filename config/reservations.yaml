# Cover-letter sentences that qualify a price or the terms. Patterns are matched on lower-cased,
# umlaut-folded text (ä -> a, ö -> o, ü -> u, ß -> ss). Written from what reservations in German
# bids look like, not from the simulator's phrase bank; the held-out sets test how far they carry.
# Sentences are matched one at a time, so patterns may span dots (dates like 15.11.2026).
# Widened after the held-out set v1 was studied (v1 is now a regression set).

kinds:
  price_validity:
    - "(preise|angebot).{0,60}(gultig|gelten|gilt|gebunden|bindefrist).{0,60}(bis|nur|innerhalb|lediglich)"
    - "(preise|angebot).{0,40}\\bbis\\b.{0,40}(gultig|gebunden)"
    - "freibleibend"
    - "anpassung (der preise )?vor"
    - "preise.{0,40}(unverbindlich|vorbehaltlich)"
  material_escalation:
    - "preisgleit"
    - "gleitklausel"
    - "material(preis)?(steigerung|erhohung|zuschlag)"
    - "preissteigerung"
    - "weiterberechn"
    - "(lohn|stahl|material).{0,30}index"
    - "preise.{0,80}anpass|passen wir (die|unsere) preise"
    - "(hersteller|lieferanten)(preis)?listen"
  scope_exclusion:
    - "nicht (im angebot |in unseren (einheits)?preisen |in den (einheits)?preisen )?(enthalten|berucksichtigt|einkalkuliert|bestandteil)"
    - "bauseits"
    - "ausgenommen"
    - "nach (tatsachlichem )?aufwand"
    - "gesondert (berechnet|abgerechnet|vergutet)"
  payment_terms:
    - "abschlag(s)?(zahlung|rechnung)"
    - "vorauszahlung|anzahlung"
    - "zahlungsziel"
    - "skonto wird nicht"
    - "ohne abzug"
    - "(bei|nach) auftragserteilung.{0,30}(zahl|%)"
  schedule:
    - "ausfuhrungsbeginn"
    - "fruhestens"
    - "(fristen|termine).{0,80}(voraus|vorbehalt|unverbindlich|nur.{0,40}wenn|zuschlag)"
    - "ohne behinderung"
  liability:
    - "vertragsstrafe"
    - "haftung.{0,80}(begrenz|ausgeschlossen|beschrank)"
    - "gewahrleistung.{0,40}(verkurzt|abweichend|jahre)"
